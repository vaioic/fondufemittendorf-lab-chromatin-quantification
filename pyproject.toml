[project]
name = "fondufemittendorf-lab-chromatin-quantification"
version = "0.1.0"
description = "Analysis of chromatin in TEM images"
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]

dependencies = [
    "numpy",
    "scikit-image",
    "matplotlib",
    "tifffile",
    "pandas>=3.0.6",
    "imagecodecs>=2026.8.16",
    "seaborn>=0.13.2",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "shared"
module-root = ""
